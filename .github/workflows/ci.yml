name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Test (live tests excluded by default addopts)
        run: pytest -q
      - name: Deterministic eval scorer smoke
        run: |
          # The scorer is deterministic and offline; a wrong answer here is a
          # defect, not a flaky provider. The clean fixture must score 100% —
          # if it does not, the scorer or the pipeline regressed.
          python -m py_compile evals/score_research.py
          python evals/score_research.py \
            evals/research_cases.jsonl \
            tests/fixtures/eval/sample_predictions_clean.jsonl \
            --markdown \
            --fail-on-errors
